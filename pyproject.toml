[project]
name = "price-predict"
version = "0.1.0"
description = "Đọc giá tin nhắn bán hàng qua Gemini Interactions API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.142.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "ASYNC", "RUF", "PERF", "S", "I"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# The OpenAPI example is a real shop message with styled Unicode letters.
"app/schemas/session.py" = ["RUF001"]
